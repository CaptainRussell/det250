<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Join · Financial Readiness · Storm HQ</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="../../shared/det250-patch-icon.png" type="image/png">
<style>
:root { --bg: #0a1428; --panel: #0f1e3a; --panel2: #152a4d; --line: #2b4370; --ink: #f4efe3; --soft: #b3bfd4; --faint: #7083a6;
  --green: #3fd69a; --red: #ff6f7d; --gold: #c9a24a; --amber: #e8b54a; --cyan: #4ea8ff;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  color-scheme: dark; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; background: radial-gradient(120% 70% at 50% 0%, #10224a, var(--bg) 60%) fixed, var(--bg); color: var(--ink); font-family: var(--font); min-height: 100%; }
body { padding: max(14px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
button, input { font: inherit; color: inherit; }
header { display: flex; align-items: center; gap: 10px; padding-bottom: 12px; border-bottom: 1px solid #3a3220; margin-bottom: 16px; }
header .t { font: 700 18px var(--serif); flex: 1; }
header .room { font: 700 13px ui-monospace, Menlo, monospace; color: var(--soft); }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--faint); display: inline-block; margin-right: 6px; }
.dot.live { background: var(--green); box-shadow: 0 0 0 4px rgba(63,214,154,.2); } .dot.error { background: var(--red); }
h1 { font: 700 26px/1.15 var(--serif); margin: 4px 0 8px; }
p { color: var(--soft); line-height: 1.45; margin: 0 0 14px; }
.px { border-radius: 6px; object-fit: cover; }
.px[src^="data:"] { image-rendering: pixelated; image-rendering: crisp-edges; }
.big-btn { width: 100%; border: 2px solid #8a7232; background: #2a2310; color: #f3dfa6; border-radius: 14px; padding: 15px; font-weight: 850; font-size: 18px; }
.big-btn:disabled { opacity: .4; }
input.code { width: 100%; text-align: center; font: 800 38px ui-monospace, Menlo, monospace; letter-spacing: .3em; text-transform: uppercase; background: var(--panel); border: 2px solid var(--line); border-radius: 14px; padding: 12px; margin-bottom: 12px; }
input.name { width: 100%; background: var(--panel); border: 2px solid var(--line); border-radius: 12px; padding: 12px; font-size: 17px; margin: 10px 0; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 10px; margin-bottom: 14px; }
.ch { border: 2px solid var(--line); background: var(--panel); border-radius: 14px; padding: 8px 6px; text-align: center; }
.ch img { width: 64px; height: 64px; display: block; margin: 0 auto 6px; }
.ch span { font-size: 12.5px; font-weight: 700; line-height: 1.2; display: block; }
.ch.on { border-color: var(--gold); background: #2a2310; }
.ch:disabled { opacity: .3; }
.pickgo.ingrid { grid-column: 1 / -1; margin: 2px 0 6px; }
.pickgo .name { margin-top: 0; }
.lab { font-size: 12px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--gold); margin: 14px 0 8px; }
.me { display: flex; align-items: center; gap: 14px; background: var(--panel); border: 2px solid var(--line); border-radius: 18px; padding: 14px; }
.me img.px { width: 72px; height: 72px; }
.me .n { font-weight: 850; font-size: 19px; }
.me .r { display: flex; align-items: center; gap: 8px; color: var(--soft); font-weight: 700; margin-top: 4px; }
.me .r i { display: inline-block; height: 22px; background: center/contain no-repeat; }
.me .s { margin-left: auto; text-align: right; font: 850 26px var(--font); color: var(--green); }
.me .s small { display: block; font-size: 11px; color: var(--faint); letter-spacing: .1em; }
.q { margin-top: 16px; }
.q .info { background: var(--panel); border-left: 3px solid var(--gold); border-radius: 8px; padding: 10px 12px; color: var(--soft); margin-bottom: 14px; font-size: 15px; }
.opts { display: grid; gap: 10px; margin-bottom: 14px; }
.opts button { text-align: left; border: 2px solid var(--line); background: var(--panel); border-radius: 14px; padding: 15px 16px; font-weight: 750; font-size: 17px; }
.opts button.on { border-color: var(--gold); background: #2a2310; }
.opts button { display: flex; align-items: center; gap: 12px; }
.opts .oi { flex: none; height: auto; max-height: 40px; object-fit: contain; }
/* the deck's slider charts, on the phone (live/explore.js) */
.ex { margin-top: 16px; background: var(--panel); border: 2px solid var(--line); border-radius: 18px; padding: 14px; }
.ex h2 { font: 700 21px var(--serif); margin: 0 0 4px; }
.ex .hint { font-size: 14px; margin-bottom: 8px; }
.plan ol { list-style: none; padding: 0; margin: 10px 0; display: grid; gap: 8px; }
.plan li button { width: 100%; display: flex; gap: 12px; align-items: flex-start; text-align: left; border: 2px solid var(--line); background: var(--panel2); color: var(--ink); border-radius: 12px; padding: 11px 12px; font: 600 15px/1.35 var(--font); cursor: pointer; }
.plan li button i { flex: none; width: 22px; height: 22px; border-radius: 6px; border: 2px solid var(--faint); margin-top: 1px; display: grid; place-items: center; }
.plan li button.on { border-color: var(--green); }
.plan li button.on i { background: var(--green); border-color: var(--green); }
.plan li button.on i::after { content: ""; width: 6px; height: 11px; border: solid #04140e; border-width: 0 3px 3px 0; transform: rotate(45deg) translate(-1px, -1px); }
.plan li button b { color: var(--gold); }
.ex .exc { width: 100%; height: auto; display: block; font-family: var(--font); }
.exr { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 10px 0; }
.exr .st { background: var(--panel2); border-radius: 10px; padding: 8px; text-align: center; min-width: 0; }
.exr .st span { display: block; font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); }
.exr .st b { font: 850 18px var(--font); color: var(--ink); }
.exr b.g { color: var(--green); } .exr b.r { color: var(--red); } .exr b.a { color: var(--amber); } .exr b.c { color: var(--cyan); }
.rg { display: block; margin-top: 6px; }
.rg .rl { font-weight: 800; font-size: 15px; } .rg .rl b { color: var(--gold); }
.rg .re { display: flex; justify-content: space-between; font-size: 12px; color: var(--faint); font-weight: 700; }
.rg .re i { font-style: normal; }
.exseg { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-top: 6px; }
.exseg button { border: 2px solid var(--line); background: var(--panel2, #1b335c); color: var(--soft); border-radius: 10px; padding: 9px 2px; font: 800 12.5px/1.15 var(--font); cursor: pointer; }
.exseg button.on { background: var(--green); border-color: var(--green); color: #04140e; }
.slider { background: var(--panel); border: 2px solid var(--line); border-radius: 16px; padding: 16px; margin-bottom: 14px; }
.slider .v { font: 850 40px var(--font); text-align: center; color: var(--amber); margin-bottom: 6px; }
input[type=range] { width: 100%; height: 44px; accent-color: var(--gold); }
.calls { display: grid; gap: 12px; margin-bottom: 14px; }
.call { background: var(--panel); border: 2px solid var(--line); border-radius: 14px; padding: 12px; }
.call .t { font-weight: 800; margin-bottom: 8px; font-size: 15px; }
.call .t small { color: var(--faint); margin-right: 6px; }
.seg { display: flex; gap: 6px; }
.seg button { flex: 1; border: 2px solid var(--line); background: var(--panel2); border-radius: 10px; padding: 10px 4px; font-weight: 800; font-size: 14px; color: var(--soft); }
.seg button.on { background: var(--gold); border-color: var(--gold); color: #1a1203; }
.wait { text-align: center; padding: 26px 8px; }
.wait .big { font: 700 22px var(--serif); color: var(--ink); margin-bottom: 6px; }
.res { border-radius: 16px; padding: 16px; margin-top: 16px; text-align: center; border: 2px solid var(--line); background: var(--panel); }
.res.ok { border-color: var(--green); } .res.no { border-color: var(--red); }
.res .p { font: 850 40px var(--font); }
.res.ok .p { color: var(--green); } .res.no .p { color: var(--red); }
.res .a { color: var(--soft); margin-top: 6px; }
.promo { animation: pop .8s cubic-bezier(.2,1.6,.4,1); }
@keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: none; opacity: 1; } }
/* name and points go under the question or chart, so what you tap is on top (Captain Russell, 25 Nov 2026) */
#app { max-width: 620px; margin: 0 auto; }
#app.wide { max-width: 1500px; }
.mebot { position: sticky; bottom: 0; margin-top: 16px; padding-bottom: max(6px, env(safe-area-inset-bottom)); background: linear-gradient(transparent, var(--bg) 30%); padding-top: 10px; }
.mebot .me { padding: 10px 14px; }
/* a laptop gets the whole slide, as on the big screen; phones the smaller chart (switch either way) */
.solo { position: relative; width: 100%; aspect-ratio: 16 / 10.4; max-height: calc(100vh - 210px); border: 2px solid var(--line); border-radius: 18px; overflow: hidden; background: #070f20; }
.solo iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.vt { display: block; margin: 10px auto 0; background: none; border: 1px solid var(--line); border-radius: 999px; padding: 7px 16px; color: var(--soft); font-weight: 750; font-size: 14px; }
.vt:hover { border-color: var(--gold); color: var(--ink); }
.small { font-size: 13px; color: var(--faint); text-align: center; margin-top: 18px; }
.small button { background: none; border: 0; color: var(--soft); text-decoration: underline; }
</style>
</head>
<body>
<header><span class="dot" id="dot"></span><span class="t">Financial Readiness</span><span class="room" id="roomLab"></span></header>
<main id="app"></main>

<script src="../live/vendor/peerjs.min.js"></script>
<script src="../live/net.js"></script>
<script src="../live/chars.js"></script>
<script src="../engine/engine.js"></script>
<script src="../lessons/shared/fr.js"></script>
<script src="../lessons/c3-brs/scene.js"></script>
<script src="../live/explore.js"></script>
<script>
/* The phone side of the live lesson. The deck sends {t:'state', ...}; this page only shows what it is sent and
   sends back a character pick and answers. Code organized with help from Claude (Anthropic), Nov 2026. */
(function () {
  'use strict';
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const md = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
  const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
  const params = new URLSearchParams(location.search);
  // one id per phone, kept so a reload keeps your character and score (?cid= lets a test run several in one browser)
  let cid = params.get('cid') || store.get('d250-fr-cid'); if (!cid) { cid = 'c' + Math.random().toString(36).slice(2, 12); store.set('d250-fr-cid', cid); }
  let code = (params.get('room') || '').toUpperCase().replace(/[^A-Z]/g, '').slice(0, 4);
  let net = null, S = null, status = 'off', pick = null, draft = {}, lastRes = null, prevRank = null, mountedEx = null, fullPick = null;
  const wideScreen = () => matchMedia('(min-width: 900px) and (min-height: 560px)').matches;

  function connect() {
    $('#roomLab').textContent = 'Room ' + code;
    net = FRNet.join(code, cid, {
      onStatus(s) { status = s; $('#dot').className = 'dot ' + s; if (s === 'live') net.send({ t: 'hi' }); render(); },
      onOpen() { net.send({ t: 'hi' }); },
      onMsg(m) { if (m.t === 'state') { const q0 = S && S.q && S.q.qid; S = m; if (!S.q || S.q.qid !== q0) draft = {}; render(); } },
    });
    // the deck may have restarted: say hello again now and then until it answers
    setInterval(() => { if (!S && net) net.send({ t: 'hi' }); }, 2500);
  }

  const insig = (r, h) => `<i style="height:${h}px;width:${h * r.ar}px;background-image:url('${r.file}')"></i>`;
  function meCard() {
    const me = S.me, c = FRChars.get(me.char), r = FRChars.rankOf(me.score);
    const promo = prevRank && prevRank !== r.rank ? ' promo' : ''; prevRank = r.rank;
    return `<div class="me${promo}"><img class="px" src="${FRChars.src(me.char)}" alt=""><div><div class="n">${esc(me.name || c.name)}</div>
      <div class="r">${insig(r, 22)}${esc(r.rank)}</div></div><div class="s">${me.score.toLocaleString()}<small>POINTS</small></div></div>`;
  }

  function render() {
    const app = $('#app');
    if (!code || code.length < 4) {
      app.innerHTML = `<h1>Join the lesson</h1><p>Type the 4-letter room code on the screen.</p>
        <input class="code" id="code" maxlength="4" autocomplete="off" autocapitalize="characters" spellcheck="false"><button class="big-btn" id="go">Join</button>`;
      const inp = $('#code'); inp.focus();
      const go = () => { const v = inp.value.toUpperCase().replace(/[^A-Z]/g, ''); if (v.length === 4) { code = v; history.replaceState(null, '', '?room=' + v + (FRNet.local() && /local=1/.test(location.search) ? '&local=1' : '')); connect(); render(); } };
      $('#go').onclick = go; inp.onkeydown = (e) => { if (e.key === 'Enter') go(); };
      return;
    }
    if (!S) { app.innerHTML = `<div class="wait"><div class="big">${status === 'error' ? 'Can\'t reach the room' : 'Connecting…'}</div><p>${status === 'error' ? 'Check the code and your Wi-Fi. It keeps trying.' : 'Room ' + esc(code)}</p></div>
      <p class="small"><button id="other">Use a different code</button></p>`; $('#other').onclick = () => { location.search = ''; }; return; }
    if (!S.me || !S.me.char) { mountedEx = null; return renderPick(app); }
    const q = S.q;
    // the chart on the screen has a phone version: play with it here (kept while the state updates)
    const ex = !q && S.explore && window.FRExplore && FRExplore.has(S.explore) ? S.explore : null;
    if (ex) {
      // the Day 1 plan is the phone's own, so it never swaps for the slide
      const own = ex === 'plan', full = own ? false : fullPick != null ? fullPick : wideScreen(), key = ex + (full ? ':full' : '');
      if (mountedEx !== key || !$('#exHost')) {
        app.innerHTML = '<div id="exHost"></div><button type="button" class="vt" id="vt"></button><div class="mebot" id="meBox"></div>';
        app.classList.toggle('wide', full);
        if (full) $('#exHost').innerHTML = `<div class="solo"><iframe src="../slides/?solo=${encodeURIComponent(ex)}" title="The slide on the screen"></iframe></div>`;
        else FRExplore.mount($('#exHost'), ex);
        $('#vt').textContent = full ? 'Show the simple version' : 'Show the full slide'; $('#vt').hidden = own;
        $('#vt').onclick = () => { fullPick = !full; render(); };
        mountedEx = key;
      }
      $('#meBox').innerHTML = meCard();
      return;
    }
    mountedEx = null; app.classList.remove('wide');
    let h = '';
    if (q && S.phase === 'open' && S.mine == null) h += renderQ(q);
    else if (q && S.phase === 'open') h += `<div class="wait"><div class="big">Locked in</div><p>${esc(S.mineText || '')}</p><p>Eyes up front for the answer.</p></div>`;
    else if (q && S.phase === 'reveal' && S.res) {
      const r = S.res;
      h += r.poll ? `<div class="res ok"><div class="p">Thanks</div><div class="a">${esc(r.mine || '')}</div><div class="a">${md(r.text || '')}</div></div>`
        : `<div class="res ${r.pts > 0 && r.ok !== false ? 'ok' : 'no'}"><div class="p">+${r.pts.toLocaleString()}</div><div class="a">${md(r.text || '')}</div></div>`;
    } else h += `<div class="wait"><div class="big">Watch the screen</div><p>Questions show up here as we go. Faster right answers score more.</p></div>`;
    app.innerHTML = h + '<div class="mebot">' + meCard() + '</div>';
    wireQ(q);
  }

  function renderPick(app) {
    const taken = new Set(S.taken || []);
    const grp = (kind) => FRChars.list.filter((c) => c.kind === kind || (kind === 'cadet' && c.kind === 'cadre'));
    const cell = (c) => `<button class="ch ${pick === c.id ? 'on' : ''}" data-id="${c.id}" ${taken.has(c.id) ? 'disabled' : ''}><img class="px" src="${FRChars.src(c.id)}" alt=""><span>${esc(c.name)}</span></button>`;
    const sel = pick && FRChars.get(pick);
    app.innerHTML = `<h1>Pick your character</h1><p>Find yourself. Not listed? Pick a student and type your name.</p>
      <div class="lab">AFAS 3410 Class</div><div class="grid">${grp('cadet').map(cell).join('')}</div>
      <div class="lab">Students</div><div class="grid">${grp('guest').map(cell).join('')}</div>
      <div class="pickgo" id="pickBox">${sel && sel.kind === 'guest' ? '<input class="name" id="gname" maxlength="24" placeholder="Your name">' : ''}
      <button class="big-btn" id="pickGo" ${pick ? '' : 'disabled'}>${sel ? 'I\'m ' + esc(sel.kind === 'guest' ? 'a student' : sel.name) : 'Pick one'}</button></div>`;
    // the confirm button goes right under the row of the one you picked (Captain Russell, 25 Nov 2026), not at the very bottom
    const on = app.querySelector('.ch.on'), box = $('#pickBox');
    if (on) {
      const grid = on.parentNode, cells = Array.from(grid.children).filter((c) => c.classList.contains('ch'));
      const cols = getComputedStyle(grid).gridTemplateColumns.split(' ').length, i = cells.indexOf(on);
      const last = cells[Math.min(cells.length - 1, Math.floor(i / cols) * cols + cols - 1)];
      last.after(box); box.classList.add('ingrid');
      box.scrollIntoView({ block: 'nearest', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
    }
    app.querySelectorAll('.ch').forEach((b) => { b.onclick = () => { pick = b.dataset.id; renderPick(app); const g = $('#gname'); if (g) g.focus(); }; });
    $('#pickGo').onclick = () => { const g = $('#gname'); const name = g ? g.value.trim() : ''; if (g && !name) { g.focus(); return; } net.send({ t: 'pick', char: pick, name }); };
  }

  function renderQ(q) {
    let h = `<div class="q"><h1>${md(q.prompt)}</h1>${q.info ? `<div class="info">${md(q.info)}</div>` : ''}`;
    // tap picks, Lock it in sends (Captain Russell, 25 Nov 2026: a tap shouldn't lock the answer right away)
    if (q.type === 'choice') h += `<div class="opts">${q.opts.map((o, i) => { const g = q.ins && q.ins[i]; return `<button data-i="${i}" class="${draft.i === i ? 'on' : ''}" aria-pressed="${draft.i === i}">${g ? `<img class="oi" src="${esc(g[0])}" alt="" style="width:${Math.min(40, 30 * g[1])}px">` : ''}<span>${esc(o)}</span></button>`; }).join('')}</div><button class="big-btn" id="oGo" ${draft.i == null ? 'disabled' : ''}>${draft.i == null ? 'Pick an answer' : 'Lock it in'}</button>`;
    if (q.type === 'slider') {
      const v = draft.v != null ? draft.v : q.start != null ? q.start : q.min;
      h += `<div class="slider"><div class="v" id="sv">${fmtV(q, v)}</div><input type="range" id="sr" min="${q.min}" max="${q.max}" step="${q.step}" value="${v}"></div><button class="big-btn" id="sGo">Lock it in</button>`;
    }
    if (q.type === 'calls') {
      h += `<div class="calls">${q.calls.map((c) => `<div class="call"><div class="t"><small>${esc(c.when)}</small>${esc(c.ask)}</div><div class="seg">${c.opts.map((o) => `<button data-k="${c.key}" data-v="${esc(o[0])}" class="${draft[c.key] === String(o[0]) ? 'on' : ''}">${esc(o[1])}</button>`).join('')}</div></div>`).join('')}</div>
        <button class="big-btn" id="cGo" ${q.calls.every((c) => draft[c.key] != null) ? '' : 'disabled'}>Lock in my ten years</button>`;
    }
    return h + '</div>';
  }
  const ordinal = (n) => n + (n % 100 >= 11 && n % 100 <= 13 ? 'th' : ['th', 'st', 'nd', 'rd'][n % 10] || 'th');
  const fmtV = (q, v) => (q.unit === '$' ? '$' + Number(v).toLocaleString() : q.unit === '$M' ? (!v ? '$0' : v < 1e6 ? '$' + Math.round(v / 1000) + 'K' : '$' + +(v / 1e6).toFixed(1) + ' million') : q.unit === 'pct' ? ordinal(+v) + ' percentile' : v + (q.unit || ''));
  function wireQ(q) {
    if (!q || S.phase !== 'open' || S.mine != null) return;
    document.querySelectorAll('.opts button').forEach((b) => { b.onclick = () => { draft.i = +b.dataset.i; render(); }; });
    const og = $('#oGo'); if (og) og.onclick = () => { if (draft.i != null) net.send({ t: 'ans', qid: q.qid, v: draft.i }); };
    const sr = $('#sr');
    if (sr) { sr.oninput = () => { draft.v = +sr.value; $('#sv').textContent = fmtV(q, +sr.value); }; $('#sGo').onclick = () => { if (q.qid === 'commit' && window.FRPlan) FRPlan.set({ tsp: +sr.value }); net.send({ t: 'ans', qid: q.qid, v: +sr.value }); }; }
    document.querySelectorAll('.seg button').forEach((b) => { b.onclick = () => { draft[b.dataset.k] = b.dataset.v; render(); }; });
    const cg = $('#cGo'); if (cg) cg.onclick = () => net.send({ t: 'ans', qid: q.qid, v: Object.assign({}, draft) });
  }

  if (code.length === 4) connect();
  render();
})();
</script>
</body>
</html>
