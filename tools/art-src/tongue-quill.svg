<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 224 224" width="224" height="224">
  <!-- AFH 33-337, The Tongue and Quill: a talking head (speaking) and a feather quill (writing).
       Drawn for the Documents and Policy card (Captain Russell, 22 Nov 2026).
       tools/doc-card-art.py renders this file and adds the T&Q band. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b6fb0"/><stop offset="1" stop-color="#063a63"/>
    </linearGradient>
    <linearGradient id="vane" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe7a3"/><stop offset="1" stop-color="#f1be48"/>
    </linearGradient>
  </defs>
  <rect width="224" height="224" fill="url(#bg)"/>
  <!-- talking head, profile facing right -->
  <path fill="#ffffff" d="M34 158 C24 124 20 84 40 56 C56 30 100 24 116 50 C122 60 122 70 120 78
    L134 96 L123 100 L125 106 L119 108 L124 114 L118 116
    C121 127 114 133 103 131 L97 142 L100 158 Z"/>
  <!-- speech lines from the mouth -->
  <g fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round">
    <path d="M136 104 q7 9 0 19"/>
    <path d="M149 96 q12 17 0 35" opacity=".8"/>
  </g>
  <!-- feather quill, nib down at the lower right -->
  <g transform="translate(136 10) rotate(24 58 80) scale(.62 .85)">
    <path fill="url(#vane)" stroke="#9a6b00" stroke-width="2.5" d="M58 6
      C84 20 92 52 80 86
      C74 104 66 118 58 130
      C52 112 40 96 34 74
      C26 46 36 18 58 6 Z"/>
    <path fill="none" stroke="#9a6b00" stroke-width="3" stroke-linecap="round" d="M58 10 C60 50 60 100 58 150"/>
    <g stroke="#c99a2e" stroke-width="2" stroke-linecap="round" opacity=".9">
      <path d="M58 40 L42 32"/><path d="M58 56 L38 50"/><path d="M58 72 L38 70"/><path d="M58 88 L42 90"/>
      <path d="M59 40 L74 30"/><path d="M59 56 L80 46"/><path d="M59 72 L80 66"/><path d="M59 88 L74 88"/>
    </g>
    <path fill="#1b1b1d" d="M55 146 L61 146 L58 166 Z"/>
  </g>
</svg>
